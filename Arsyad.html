<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata Diri - Muhammad Arsyad Fauzan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      padding: 20px;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    .card-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      margin: 0 auto 16px;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3);
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
    }

    .divider {
      height: 3px;
      width: 40px;
      background: #2563eb;
      margin: 12px auto 0;
      border-radius: 2px;
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .info-item {
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 12px;
      border-left: 4px solid #2563eb;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .value {
      font-size: 15px;
      font-weight: 500;
      color: #0f172a;
      line-height: 1.4;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      width: fit-content;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <div class="avatar">M</div>
      <h1 class="card-title">Biodata Diri</h1>
      <div class="divider"></div>
    </div>

    <div class="info-list">
      <div class="info-item">
        <span class="label">Nama Lengkap</span>
        <span class="value">Muhammad Arsyad Fauzan</span>
      </div>

      <div class="info-item">
        <span class="label">Tanggal Lahir</span>
        <span class="value">19 Juni 2012</span>
      </div>

      <div class="info-item">
        <span class="label">Alamat</span>
        <span class="value">Batara Indah Land 08, Cilengkrang, Bandung</span>
      </div>

      <div class="info-item">
        <span class="label">Hobi</span>
        <div class="value">
          <span class="badge">♟️ Catur</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
