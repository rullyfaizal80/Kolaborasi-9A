<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Artistik Abimanyu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables untuk Mode Terang (Default) */
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #555555;
            --accent-color: #ff6b6b; /* Warna aksen merah seniman */
            --border-color: #e1e1e1;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
        }

        /* CSS Variables untuk Mode Gelap */
        body.dark-mode {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-main: #f5f5f5;
            --text-muted: #b0b0b0;
            --accent-color: #e94560;
            --border-color: #2a365f;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.4s ease, color 0.4s ease;
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 20px 20px; /* Motif titik-titik seperti kertas gambar */
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            width: 350px;
            position: relative;
            transition: background-color 0.4s ease, box-shadow 0.4s ease;
            border: 2px dashed var(--accent-color); /* Garis putus-putus ala sketsa */
        }

        /* Tombol Mode Gelap/Terang */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-main);
            transition: transform 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(15deg);
        }

        h1 {
            font-family: 'Caveat', cursive; /* Font yang terlihat seperti tulisan tangan/kuas */
            color: var(--accent-color);
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 38px;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 10px;
            letter-spacing: 2px;
        }

        .info-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .info {
            font-size: 15px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            transition: border-color 0.4s ease, color 0.4s ease;
        }

        .info:last-child {
            border-bottom: none;
        }

        strong {
            color: var(--text-main);
            display: inline-block;
            width: 120px;
            font-weight: 600;
        }

        /* Ikon palet warna kecil di sudut */
        .art-icon {
            text-align: center;
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <button class="theme-toggle" id="toggleBtn" title="Ubah Tema">🎨</button>
        
        <div class="art-icon">🖌️</div>
        <h1>Biodata Diri</h1>
        
        <div class="info-container">
            <div class="info"><strong>Nama:</strong> Abimanyu Putra Radana</div>
            <div class="info"><strong>Tanggal Lahir:</strong> 25 Maret 2012</div>
            <div class="info"><strong>Alamat:</strong> Cilajahilir, Sindanglaya</div>
            <div class="info"><strong>Hobi:</strong> Menggambar ✏️</div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const body = document.body;

        toggleBtn.addEventListener('click', () => {
            // Menambah atau menghapus class 'dark-mode' pada elemen body
            body.classList.toggle('dark-mode');
            
            // Ubah ikon tombol berdasarkan tema
            if (body.classList.contains('dark-mode')) {
                toggleBtn.textContent = '💡'; // Ikon lampu menyala untuk kembali ke mode terang
            } else {
                toggleBtn.textContent = '🎨'; // Ikon palet untuk mode terang
            }
        });
    </script>

</body>
</html>
