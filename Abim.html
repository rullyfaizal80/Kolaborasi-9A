<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata & Car Race - Abimanyu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* CSS Variables untuk Tema Gelap dan Terang */
        :root {
            --bg-main: #f4efe6;
            --bg-dots: #d8cebe;
            --card-bg: #ffffff;
            --text-main: #3d405b;
            --text-sub: #8d8d8d;
            --border-color: #e8decb;
            --item-bg: #fdfbf7;
            --accent-green: #81b29a;
            --accent-orange: #e07a5f;
            --arcade-bg: #3d405b;
            --canvas-bg: #f4efe6;
            --canvas-border: #2b2d42;
        }

        /* Override Variables saat mode gelap (dark-mode) aktif */
        body.dark-mode {
            --bg-main: #1a1a24;
            --bg-dots: #2a2a3a;
            --card-bg: #2b2d42;
            --text-main: #f4efe6;
            --text-sub: #a0a0b5;
            --border-color: #3d405b;
            --item-bg: #1f2130;
            --accent-green: #59987b;
            --accent-orange: #d66447;
            --arcade-bg: #1a1a24;
            --canvas-bg: #2b2d42;
            --canvas-border: #f4efe6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(var(--bg-dots) 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            gap: 30px;
            color: var(--text-main);
        }

        /* Tombol Tema */
        #themeToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            z-index: 100;
        }

        /* Biodata Card Styles */
        .art-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .profile-frame {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            background: var(--item-bg);
            border: 3px solid var(--text-main);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 4px 4px 0px var(--text-main);
        }

        h1 { font-family: 'Caveat', cursive; text-align: center; font-size: 36px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 13px; color: var(--text-sub); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; font-weight: 600; }

        .info-group { display: flex; flex-direction: column; gap: 12px; }
        .info-item {
            background: var(--item-bg);
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-green);
        }
        .info-item.highlight { border-left-color: var(--accent-orange); }
        .label { font-size: 11px; text-transform: uppercase; color: var(--text-sub); font-weight: 700; }
        .value { font-size: 14px; font-weight: 600; }

        /* Arcade Styles */
        .arcade-container {
            background-color: var(--arcade-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 4px solid var(--accent-orange);
        }

        .arcade-title {
            color: var(--accent-orange);
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px var(--canvas-border);
        }

        canvas {
            background-color: var(--canvas-bg);
            border: 4px solid var(--canvas-border);
            border-radius: 8px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            cursor: pointer;
        }

        button.btn-start {
            background-color: var(--accent-green);
            color: white;
            border: 2px solid var(--canvas-border);
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 var(--canvas-border);
            width: 100%;
        }
        button.btn-start:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--canvas-border); }

        .instructions { color: #8d8d8d; font-size: 12px; margin-top: 10px; line-height: 1.5; }
        #scoreBoard { color: white; font-family: 'Press Start 2P', cursive; font-size: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <button id="themeToggle" onclick="toggleTheme()">🌙</button>

    <div class="art-card">
        <div class="profile-frame">🎨</div>
        <h1>Abimanyu Putra Radana</h1>
        <p class="subtitle">Art & Creative Profile</p>
        <div class="info-group">
            <div class="info-item">
                <div class="label">Tanggal Lahir</div>
                <div class="value">25 Maret 2012</div>
            </div>
            <div class="info-item">
                <div class="label">Alamat</div>
                <div class="value">Desa Cikajahilir, Sindanglaya</div>
            </div>
            <div class="info-item highlight">
                <div class="label">Minat & Hobi</div>
                <div class="value">✏️ Menggambar & 🏎️ Balapan</div>
            </div>
        </div>
    </div>

    <div class="arcade-container">
        <h2 class="arcade-title">CAR RACE</h2>
        <div id="scoreBoard">Score: 0</div>
        
        <canvas id="gameCanvas" width="300" height="300"></canvas>

        <button class="btn-start" onclick="startGame()">Mulai Balapan</button>
        <div class="instructions">
            Gunakan tombol <b>PANAH KIRI & KANAN</b> (atau <b>TAP</b> sisi kiri/kanan layar) untuk menghindari rintangan!
        </div>
    </div>
