<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Seniman - Abimanyu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Latar belakang bernuansa kanvas halus dan palet cat */
            background-color: #f4efe6;
            background-image: radial-gradient(#d8cebe 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Kartu dengan tema bingkai/kanvas seni */
        .art-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(80, 65, 45, 0.1);
            border: 1px solid #e8decb;
            position: relative;
            overflow: hidden;
        }

        /* Hiasan aksen cat/palet di pojok atas */
        .art-card::before {
            content: '';
            position: absolute;
            top: -25px;
            right: -25px;
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #e07a5f, #f2cc8f);
            border-radius: 50%;
            opacity: 0.8;
            z-index: 1;
        }

        /* Avatar Placeholder Bergaya Kanvas */
        .profile-frame {
            position: relative;
            z-index: 2;
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            background: #fdfbf7;
            border: 3px solid #3d405b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            box-shadow: 4px 4px 0px #3d405b;
        }

        h1 {
            font-family: 'Caveat', cursive;
            color: #3d405b;
            text-align: center;
            font-size: 36px;
            margin-bottom: 5px;
            line-height: 1;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #8d8d8d;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .divider {
            height: 2px;
            background: linear-gradient(to right, transparent, #e07a5f, #81b29a, transparent);
            border: none;
            margin-bottom: 25px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            background: #fdfbf7;
            padding: 12px 16px;
            border-radius: 10px;
            border-left: 4px solid #81b29a;
            transition: transform 0.2s ease;
        }

        .info-item:hover {
            transform: translateX(4px);
        }

        .info-item.highlight {
            border-left-color: #e07a5f;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .value {
            font-size: 15px;
            color: #2b2d42;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Badge khusus untuk hobi */
        .hobby-tag {
            display: inline-block;
            background-color: #f2cc8f;
            color: #3d405b;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 4px;
            width: fit-content;
        }
    </style>
</head>
<body>

    <div class="art-card">
        <div class="profile-frame">🎨</div>

        <h1>Abimanyu Putra Radana</h1>
        <p class="subtitle">Art & Creative Profile</p>

        <hr class="divider">

        <div class="info-group">
            <div class="info-item">
                <span class="label">Tanggal Lahir</span>
                <span class="value">25 Maret 2012</span>
            </div>

            <div class="info-item">
                <span class="label">Alamat</span>
                <span class="value">Desa Cikajahilir, Sindanglaya</span>
            </div>

            <div class="info-item highlight">
                <span class="label">Minat & Hobi</span>
                <span class="hobby-tag">✏️ Menggambar</span>
            </div>
        </div>
    </div>

</body>
</html>
