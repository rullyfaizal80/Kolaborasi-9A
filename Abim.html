<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Artistik Abimanyu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables - Tema Terang (Industrial Sketch) */
        :root {
            --bg-color: #e5e7eb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #4b5563;
            --accent-color: #2563eb; /* Biru Elektrik */
            --border-color: #111827;
            --shadow: 8px 8px 0px #111827; /* Bayangan keras gaya komik/street style */
        }

        /* CSS Variables - Tema Gelap (Dark Graphite) */
        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8; /* Cyan Neon */
            --border-color: #38bdf8;
            --shadow: 8px 8px 0px #0284c7;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: all 0.3s ease;
            /* Pola Latar Belakang Kertas Kotak-Kotak (Grid Blueprint) */
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 35px;
            border-radius: 4px; /* Sudut lebih tegas/tajam */
            border: 3px solid var(--border-color);
            box-shadow: var(--shadow);
            width: 350px;
            position: relative;
            transition: all 0.3s ease;
        }

        /* Tombol Mode Gelap/Terang */
        .theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--border-color);
            color: var(--card-bg);
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            font-family: 'Space Grotesk', sans-serif;
            cursor: pointer;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
        }

        .tag {
            display: inline-block;
            background-color: var(--accent-color);
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif; /* Font tegas & bold */
            color: var(--text-main);
            text-align: left;
            margin: 0 0 20px 0;
            font-size: 42px;
            letter-spacing: 2px;
            line-height: 0.9;
            text-transform: uppercase;
        }

        .info-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .info {
            font-size: 14px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        strong {
            color: var(--text-main);
            display: inline-block;
            width: 120px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .accent-text {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <button class="theme-toggle" id="toggleBtn">MODE: DARK</button>
        
        <div class="tag">ARTIST PROFILE</div>
        <h1>BIODATA DIRI</h1>
        
        <div class="info-container">
            <div class="info"><strong>Nama:</strong> Abimanyu Putra Radana</div>
            <div class="info"><strong>Tgl Lahir:</strong> 25 Maret 2012</div>
            <div class="info"><strong>Alamat:</strong> Cilajahilir, Sindanglaya</div>
            <div class="info"><strong>Hobi:</strong> <span class="accent-text">Menggambar / Drawing ✍️</span></div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const body = document.body;

        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                toggleBtn.textContent = 'MODE: LIGHT';
            } else {
                toggleBtn.textContent = 'MODE: DARK';
            }
        });
    </script>

</body>
</html>
