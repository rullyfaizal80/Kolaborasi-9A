<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Elegan</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Background Tema Dark Luxury & Money (Emas + Emerald Elegan) */
            background: radial-gradient(circle at center, #1b2e2b 0%, #0d1614 60%, #050a09 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            /* Tampilan Kaca Gelap dengan Akses List Emas */
            background: rgba(20, 35, 30, 0.75);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.15);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        h1 {
            /* Warna Teks Judul Emas Gradien */
            background: linear-gradient(135deg, #ffe082 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            font-size: 24px;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.5);
            padding-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .info {
            margin-bottom: 16px;
            font-size: 15px;
            color: #d1d5db;
            display: flex;
            align-items: flex-start;
            line-height: 1.5;
        }

        .info:last-child {
            margin-bottom: 0;
        }

        strong {
            color: #f3e5ab; /* Akses warna emas muda untuk label */
            min-width: 120px;
            font-weight: 600;
        }

        .value {
            flex: 1;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Biodata Diri</h1>
        <div class="info">
            <strong>Nama:</strong>
            <span class="value">Irham Fahturodzi</span>
        </div>
        <div class="info">
            <strong>Tanggal Lahir:</strong>
            <span class="value">15 Oktober 2011</span>
        </div>
        <div class="info">
            <strong>Alamat:</strong>
            <span class="value">Sindanglaya Komplek Bumi Pasundan Kav. 30</span>
        </div>
        <div class="info">
            <strong>Hobi:</strong>
            <span class="value">Pingpong dan Jalan-jalan</span>
        </div>
    </div>

</body>
</html>
