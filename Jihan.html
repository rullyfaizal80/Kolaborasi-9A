<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Diri ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reset & Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #fff0f3; /* Soft Pastel Pink Background */
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Card Container */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            overflow: hidden;
            border: 1px solid #ffe5ec;
        }

        /* Header Section */
        .header {
            background: linear-gradient(135deg, #ffccd5, #ffb3c6);
            height: 130px;
            position: relative;
        }

        /* Profile Picture */
        .profile-img-container {
            width: 100px;
            height: 100px;
            margin: 0 auto;
            position: relative;
            top: -50px;
            margin-bottom: -40px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #ffffff;
            object-fit: cover;
            box-shadow: 0 4px 12px rgba(255, 153, 172, 0.25);
        }

        /* Content Section */
        .content {
            padding: 25px;
            text-align: center;
        }

        .name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #5c3d46;
            margin-bottom: 4px;
        }

        .tagline {
            font-size: 0.85rem;
            color: #9e6b78;
            margin-bottom: 20px;
            font-weight: 400;
        }

        /* Info List */
        .info-group {
            text-align: left;
            background-color: #fff8f9;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid #ffe0e6;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px dashed #ffd1dc;
            font-size: 0.88rem;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 500;
            color: #804d59;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-value {
            color: #666;
            font-weight: 400;
        }

        /* Hobi & Minat */
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #5c3d46;
            margin-bottom: 12px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hobbies {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .hobby-tag {
            background-color: #ffe5ec;
            color: #733d4a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Social Media Button */
        .btn-instagram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background-color: #ffb3c6;
            color: #5c202e;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .btn-instagram:hover {
            background-color: #ffa0b5;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header"></div>

    
        <div class="content">
            <h1 class="name">jihan Fakhira</h1>
            <p class="tagline">Student & Creative Mind ✨</p>

             <div class="info-group">
                <div class="info-item">
                    <span class="info-label">🎂 Nama</span>
                    <span class="info-value">Jihan Fakhira</span>
                </div>

            <div class="info-group">
                <div class="info-item">
                    <span class="info-label">🎂 TTL</span>
                    <span class="info-value">07 Oktober 2011</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🏫 Sekolah</span>
                    <span class="info-value">XI - MTs Informatika MIMHa</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🌟 Hobi</span>
                    <span class="info-value">Memasak</span>
                </div>
                <div class="info-item">
                    <span class="info-label">🌷 Makanan Favorit</span>
                    <span class="info-value">Cake</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
