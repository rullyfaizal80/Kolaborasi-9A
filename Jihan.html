<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biodata Diri</title>

    <style>

        /* Mengatur background dan font keseluruhan */

        body {

            background-color: #fff0f5; /* LavenderBlush / Pink sangat soft */

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            margin: 0;

        }

        /* Kotak kartu biodata */

        .card {

            background-color: #ffffff;

            padding: 30px 40px;

            border-radius: 20px;

            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4); /* Efek bayangan pink */

            width: 350px;

            text-align: center;

            border: 2px solid #ffccd5; /* Border pink lembut */

        }



        /* Judul Biodata */

        .card h2 {

            color: #d87093; /* PaleVioletRed */

            margin-bottom: 25px;

            font-size: 24px;

            letter-spacing: 1px;

        }



        /* Styling untuk setiap baris data */

        .biodata-item {

            display: flex;

            justify-content: space-between;

            margin-bottom: 12px;

            padding: 8px 0;

            border-bottom: 1px dashed #ffe4e1; /* Garis putus-putus pink */

            font-size: 15px;

            text-align: left;

        }



        /* Label (Nama, Tanggal Lahir, Kelas) */

        .label {

            font-weight: bold;

            color: #b05773;

            width: 40%;

        }



        /* Titik dua */

        .separator {

            color: #d87093;

            width: 5%;

            text-align: center;

        }



        /* Isi data */

        .value {

            color: #666666;

            width: 55%;

        }

    </style>

</head>

<body>



    <div class="card">

        <h2>Biodata Diri</h2>

       

        <div class="biodata-item">

            <span class="label">Nama</span>

            <span class="separator">:</span>

            <span class="value">Jihan Fakhira</span>

        </div>



        <div class="biodata-item">

            <span class="label">Tanggal Lahir</span>

            <span class="separator">:</span>

            <span class="value">07 Oktober 2011</span>

        </div>



         <div class="biodata-item">

            <span class="label">Umur</span>

            <span class="separator">:</span>

            <span class="value">14 Tahun</span>

        </div>



        <div class="biodata-item">

            <span class="label">Kelas</span>

            <span class="separator">:</span>

            <span class="value">9A Al-Himmah</span>

        </div>

    </div>



</body>

</html>
