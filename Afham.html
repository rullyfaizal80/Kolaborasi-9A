<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata - Muhammad Afham Muayyad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 1.8rem;
            color: #00d2ff;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 0.9rem;
            color: #a8ff78;
        }
        .info-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border-left: 4px solid #00d2ff;
        }
        .label {
            font-weight: bold;
            color: #a8ff78;
        }
        .value {
            text-align: right;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>BIODATA DIRI</h1>
            <p>MTs Tsanawiyah Informatika</p>
        </div>

        <div class="info-group">
            <div class="info-item">
                <span class="label">Nama</span>
                <span class="value">Muhammad Afham Muayyad</span>
            </div>
            <div class="info-item">
                <span class="label">TTL</span>
                <span class="value">Bandung, 20 Maret 2012</span>
            </div>
            <div class="info-item">
                <span class="label">Kelas</span>
                <span class="value">9A Al-Himmah</span>
            </div>
            <div class="info-item">
                <span class="label">Sekolah</span>
                <span class="value">MTs Tsanawiyah Informatika</span>
            </div>
            <div class="info-item">
                <span class="label">Hobi</span>
                <span class="value">Segala hal mengenai fisika ⚛️</span>
            </div>
        </div>
    </div>

</body>
</html>
