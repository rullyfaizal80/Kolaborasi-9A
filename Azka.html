<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Diri - Azka Khoirurosyid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    width:400px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
    overflow:hidden;
    transition:0.4s;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 40px rgba(0,0,0,0.35);
}

.header{
    background:linear-gradient(135deg,#0077ff,#00c6ff);
    color:white;
    text-align:center;
    padding:30px;
}

.foto{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid white;
    background:#ddd;
    margin:auto;
    overflow:hidden;
}

.foto img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header h1{
    margin-top:15px;
    font-size:28px;
}

.header p{
    font-size:15px;
    opacity:0.9;
}

.content{
    padding:25px;
}

table{
    width:100%;
    border-collapse:collapse;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

td:first-child{
    font-weight:bold;
    color:#0077ff;
    width:40%;
}

.footer{
    text-align:center;
    padding:15px;
    background:#f4f4f4;
    color:#555;
    font-size:14px;
}
</style>

</head>
<body>

<div class="card">

    <div class="header">

        <div class="foto">
            <!-- Ganti foto.jpg dengan foto kamu -->
            <img src="foto.jpg" alt="Foto Profil">
        </div>

        <h1>Azka Khoirurosyid</h1>
        <p>Biodata Diri</p>

    </div>

    <div class="content">

        <table>

            <tr>
                <td>Nama</td>
                <td>Azka Khoirurosyid</td>
            </tr>

            <tr>
                <td>Kelas</td>
                <td>9 Al-Himmah</td>
            </tr>

            <tr>
                <td>Tanggal Lahir</td>
                <td>03 Juni 2011</td>
            </tr>

            <tr>
                <td>Sekolah</td>
                <td>Mimha Sanawiyah Informatika</td>
            </tr>

            <tr>
                <td>Tempat Tinggal</td>
                <td>Bandung, Mandalajati</td>
            </tr>

            <tr>
                <td>Jenis Kelamin</td>
                <td>Laki-laki</td>
            </tr>

        </table>

    </div>

    <div class="footer">
        © 2026 | Biodata Azka Khoirurosyid
    </div>

</div>

</body>
</html>
