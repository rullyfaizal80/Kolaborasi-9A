<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata Diri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffd1dc, #ffe6ea);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
      width: 100%;
      max-width: 400px;
      padding: 30px;
      text-align: center;
      border: 2px solid #ffb6c1;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ff69b4;
      margin-bottom: 15px;
    }

    h1 {
      color: #d81b60;
      font-size: 24px;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #ff69b4;
      font-size: 14px;
      margin-bottom: 25px;
      font-style: italic;
    }

    .info-group {
      text-align: left;
      margin-bottom: 15px;
      background-color: #fff0f5;
      padding: 10px 15px;
      border-radius: 12px;
      border-left: 4px solid #ff69b4;
    }

    .info-label {
      font-size: 12px;
      color: #ad1457;
      font-weight: bold;
      text-transform: uppercase;
      display: block;
    }

    .info-value {
      font-size: 15px;
      color: #4a4a4a;
      margin-top: 2px;
    }

    .social-links {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .btn-pink {
      background-color: #ff69b4;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .btn-pink:hover {
      background-color: #d81b60;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Nur Qaireen Fathiyah</h1>
    <p class="subtitle">🌸 Student🌸</p>

    <div class="info-group">
      <span class="info-label">Nama Lengkap</span>
      <div class="info-value">Nur Qaireen Fathiyah</div>
    </div>

    <div class="info-group">
      <span class="info-label">Tanggal Lahir</span>
      <div class="info-value">20 juli 2012</div>
    </div>

    <div class="info-group">
      <span class="info-label">Hobi</span>
      <div class="info-value">membaca Buku</div>
    </div>

    <div class="info-group">
      <span class="info-label">Makanan Favorit</span>
      <div class="info-value"> Ice Cream 🍓</div>
    </div>

    <div class="info-group">
      <span class="info-label">Sekolah</span>
      <div class="info-value">MTs Informatika MIMHa</div>
    </div>

</body>
</html>
