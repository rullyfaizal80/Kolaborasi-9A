<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Cantik Nur Qaireen 🌸</title>
  <!-- Import Font Imut dari Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Mali:ital,wght@1,500&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Background Utama */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fredoka', sans-serif;
      /* Background soft pastel gradient */
      background: linear-gradient(135deg, #ffd1dc 0%, #ffe4e1 50%, #fbc2eb 100%);
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Stiker Latar Belakang Rame */
    .bg-sticker {
      position: absolute;
      font-size: 2.2rem;
      user-select: none;
      animation: float 3s ease-in-out infinite alternate;
      opacity: 0.8;
    }

    /* Posisi Stiker Latar */
    .s1 { top: 8%; left: 10%; animation-delay: 0s; }
    .s2 { top: 12%; right: 12%; animation-delay: 0.5s; }
    .s3 { bottom: 10%; left: 8%; animation-delay: 1s; }
    .s4 { bottom: 15%; right: 10%; animation-delay: 1.5s; }
    .s5 { top: 50%; left: 4%; animation-delay: 0.8s; }
    .s6 { top: 45%; right: 5%; animation-delay: 1.2s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-15px) rotate(10deg); }
    }

    /* Container Kartu Utama */
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 440px;
      border-radius: 30px;
      padding: 35px 25px;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25), 
                  0 0 0 5px #fff inset, 
                  0 0 0 9px #ffb6c1;
      text-align: center;
      position: relative;
      z-index: 10;
      animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Header Profile */
    .header {
      margin-bottom: 25px;
    }

    .header .avatar {
      font-size: 3.5rem;
      background: #ffe6f0;
      width: 90px;
      height: 90px;
      line-height: 90px;
      border-radius: 50%;
      margin: 0 auto 15px auto;
      box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
      border: 3px dashed #ff69b4;
    }

    .header h1 {
      color: #ff2a75;
      font-size: 1.8rem;
      font-weight: 700;
      text-shadow: 2px 2px 0px #ffe4e1;
      margin-bottom: 5px;
    }

    .header .badge {
      display: inline-block;
      background: linear-gradient(45deg, #ff758c, #ff7eb3);
      color: white;
      font-family: 'Mali', cursive;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 5px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(255, 117, 140, 0.4);
    }

    /* Daftar Info */
    .info-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .info-item {
      background: linear-gradient(to right, #fff0f5, #ffe4e1);
      border: 2px solid #ffb6c1;
      border-left: 6px solid #ff1493;
      border-radius: 18px;
      padding: 12px 18px;
      text-align: left;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* Efek Goyang Saat Hover */
    .info-item:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 20px rgba(255, 105, 180, 0.25);
      background: linear-gradient(to right, #ffe4e1, #ffd1dc);
    }

    .info-item .label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #d81b60;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .info-item .value {
      font-size: 1.05rem;
      color: #4a4a4a;
      font-weight: 600;
    }

    /* Footer / Pemanis Kartu */
    .footer-decor {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #ff69b4;
      font-family: 'Mali', cursive;
    }
  </style>
</head>
<body>

  <!-- Stiker Rame Latar Belakang -->
  <div class="bg-sticker s1">🎀</div>
  <div class="bg-sticker s2">✨</div>
  <div class="bg-sticker s3">🍓</div>
  <div class="bg-sticker s4">🌷</div>
  <div class="bg-sticker s5">💖</div>
  <div class="bg-sticker s6">🧸</div>

  <!-- Kartu Profil -->
  <div class="card">
    <div class="header">
      <div class="avatar">👑</div>
      <h1>Nur Qaireen Fathiyah</h1>
      <span class="badge">🌸 Student 🌸</span>
    </div>

    <div class="info-list">
      <div class="info-item">
        <div class="label">🎀 Nama Lengkap</div>
        <div class="value">Nur Qaireen Fathiyah</div>
      </div>

      <div class="info-item">
        <div class="label">🎂 Tanggal Lahir</div>
        <div class="value">20 Juli 2012</div>
      </div>

      <div class="info-item">
        <div class="label">📖 Hobi</div>
        <div class="value">Membaca Buku 📚✨</div>
      </div>

      <div class="info-item">
        <div class="label">🍦 Makanan Favorit</div>
        <div class="value">Ice Cream 🍓🍨</div>
      </div>

      <div class="info-item">
        <div class="label">🏫 Sekolah</div>
        <div class="value">MTs Informatika MIMHa 🎓</div>
      </div>
    </div>

    <div class="footer-decor">
      ✨ Have a sweet day! ✨
    </div>
  </div>

</body>
</html>
