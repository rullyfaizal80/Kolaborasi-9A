<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Sederhana + CSS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ff94d6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #ff7aa2;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(255, 111, 178, 0.1);
            width: 350px;
        }
        h1 {
            color: #f1528f;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #d3438b;
            padding-bottom: 10px;
        }
        .info {
            margin-bottom: 15px;
            font-size: 16px;
            color: #ffb3df;
        }
        strong {
            color: #ffabeaf8;
            display: inline-block;
            width: 120px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Biodata Diri</h1>
        <div class="info"><strong>Nama:</strong> Nur Qaireen Fathiyah</div>
        <div class="info"><strong>Tanggal Lahir:</strong> 20 Juli 2012</div>
        <div class="info"><strong>Kelas:</strong>  Al-Himmah</div>
        <div class="info"><strong>Sekolah:</strong> MTs MIMHA</div>
    </div>

</body>
</html>
